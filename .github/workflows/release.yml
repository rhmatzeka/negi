name: Release

# Pushing a tag vX.Y.Z builds the release on GitHub's Apple silicon runner, attests where the
# tarball came from, and publishes it with the tag's message as the notes. The registries
# are published to only once each is set up (docs/DEVELOPMENT.md, Releasing).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write # the GitHub release and its files
      id-token: write # attestation, and trusted publishing to crates.io and npm
      attestations: write # the build provenance of the tarball
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG but Cargo.toml says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # A release builds from nothing cached: a cache can be written by a pull request.
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Build
        run: sh scripts/release.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/negi-*-darwin-arm64.tar.gz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "negi $VERSION" --notes-from-tag
          gh release upload "$TAG" dist/negi-*-darwin-arm64.tar.gz dist/negi-*-darwin-arm64.tar.gz.sha256 --clobber

      # crates.io trusted publishing: set the repository variable PUBLISH_CRATES to true once
      # crates.io lists this workflow as a trusted publisher of negi.
      - if: vars.PUBLISH_CRATES == 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: vars.PUBLISH_CRATES == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: cargo publish --allow-dirty

      # npm trusted publishing, with provenance: PUBLISH_NPM true once npmjs.com lists this
      # workflow as a trusted publisher of @rifuki/negi.
      - if: vars.PUBLISH_NPM == 'true'
        working-directory: dist/npm
        run: npm publish --access public --provenance

      # The tap is another repository: a fine-grained token with contents write on
      # rifuki/homebrew-tap, saved as the secret HOMEBREW_TAP_TOKEN.
      - name: Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/rifuki/homebrew-tap.git" tap
          cp dist/negi.rb tap/Formula/negi.rb
          cd tap
          git add Formula/negi.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "negi $VERSION"
          git push
