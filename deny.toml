# cargo-deny: known vulnerabilities, licences, and where crates may come from.

[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# Every RustSec advisory fails the check, unmaintained crates included.
unmaintained = "all"
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Crates from crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
